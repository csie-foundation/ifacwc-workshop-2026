<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety as a System Property — Opening Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #1A5FA8;
    --gold-light: #2B7DD4;
    --orange: #C04010;
    --font-disp: 'Cormorant Garant', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'DM Mono', 'Fira Mono', monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
  }
  body {
    font-family: var(--font-body);
    background: #0A1628;
    color: #E8EEF8;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Grain overlay ─────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.02;
    pointer-events: none;
    z-index: 1000;
  }

  .slide {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(2rem, 6vw, 6.5rem);
    overflow: hidden;
  }
  .right-group {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  #hero-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.8;
  }
  .slide-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 30%, rgba(43, 125, 212, 0.16) 0%, transparent 65%),
      radial-gradient(ellipse 55% 75% at 90% 75%, rgba(14, 116, 144, 0.12) 0%, transparent 60%),
      radial-gradient(ellipse 100% 100% at 50% 100%, rgba(10, 22, 40, 0.7) 0%, transparent 55%);
  }

  /* ─── Main content column ───────────────────────────────── */
  .content {
    position: relative;
    z-index: 2;
    max-width: 66%;
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.15s forwards;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.4rem 1rem 0.4rem 0.55rem;
    background: rgba(43, 125, 212, 0.15);
    border: 1px solid rgba(43, 125, 212, 0.32);
    border-radius: 100px;
    margin-bottom: clamp(1.4rem, 2.2vw, 2rem);
  }
  .badge-dot {
    width: 7px; height: 7px;
    background: var(--gold-light);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--gold-light);
  }
  .badge-text {
    font-size: clamp(0.75rem, 1vw, 0.9rem);
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #7AAEE8;
  }
  h1.title {
    font-family: var(--font-disp);
    font-weight: 300;
    font-size: clamp(3.2rem, 6.4vw, 6rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: #E8EEF8;
    margin-bottom: clamp(0.9rem, 1.7vw, 1.3rem);
  }
  h1.title em {
    font-style: italic;
    color: #7AAEE8;
  }
  .subtitle {
    font-family: var(--font-disp);
    font-weight: 400;
    font-size: clamp(1.35rem, 2.4vw, 2rem);
    color: #8AAAD4;
    letter-spacing: 0.01em;
    margin-bottom: clamp(2.4rem, 4vw, 3.6rem);
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(1.6rem, 3.4vw, 3.4rem);
  }
  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .meta-label {
    font-size: clamp(0.68rem, 0.85vw, 0.8rem);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7AAEE8;
  }
  .meta-value {
    font-size: clamp(1.05rem, 1.5vw, 1.3rem);
    font-weight: 400;
    color: #E8EEF8;
  }

  /* ─── QR panel ───────────────────────────────────────────── */
  .divider {
    position: relative;
    z-index: 2;
    width: 1px;
    align-self: stretch;
    margin: clamp(2.5rem, 6vw, 5rem) clamp(2.5rem, 5vw, 5rem);
    background: linear-gradient(to bottom, transparent, rgba(43, 125, 212, 0.4) 20%, rgba(43, 125, 212, 0.4) 80%, transparent);
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.35s forwards;
  }
  .qr-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 1.8vw, 1.4rem);
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.5s forwards;
  }
  .qr-eyebrow {
    font-size: clamp(0.7rem, 0.9vw, 0.85rem);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #7AAEE8;
  }
  .qr-card {
    padding: clamp(1.1rem, 1.9vw, 1.6rem);
    background: #F2F5FA;
    border-radius: 16px;
    box-shadow:
      0 2px 8px rgba(0, 0, 0, 0.25),
      0 24px 70px rgba(43, 125, 212, 0.25),
      0 0 0 1px rgba(43, 125, 212, 0.35);
  }
  .qr-card img {
    display: block;
    width: clamp(200px, 20vw, 300px);
    height: clamp(200px, 20vw, 300px);
  }
  .qr-caption {
    text-align: center;
  }
  .qr-caption-label {
    font-size: clamp(0.68rem, 0.85vw, 0.8rem);
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7AAEE8;
    margin-bottom: 0.35rem;
  }
  .qr-caption-url {
    font-family: var(--font-mono);
    font-size: clamp(0.68rem, 0.85vw, 0.82rem);
    color: #C8DDF8;
    letter-spacing: 0.01em;
  }

  /* ─── Footer logos ───────────────────────────────────────── */
  .footer-logo {
    position: absolute;
    bottom: clamp(1.4rem, 2.6vw, 2.4rem);
    right: clamp(2rem, 6vw, 6.5rem);
    z-index: 2;
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.75s forwards;
  }
  .footer-logo img {
    height: clamp(38px, 4.5vw, 58px);
    width: auto;
    filter: drop-shadow(0 4px 16px rgba(43, 125, 212, 0.25));
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 900px) {
    .slide { flex-direction: column; justify-content: center; gap: 2.5rem; padding: 2rem; }
    .content { max-width: 100%; text-align: center; }
    .badge, .meta { justify-content: center; }
    .qr-panel { margin: 0 auto; }
    .footer-logo { position: static; margin-top: 1rem; align-self: center; }
  }
</style>
</head>

  <script>
    /* ── Hero Canvas — Autonomy Pipeline Diagram (mirrors index.html) ── */
    (function() {
      const canvas = document.getElementById('hero-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, nodes, edges, layerXs;
      const GOLD = 'rgba(43, 125, 212,';
      const TEAL = 'rgba(14, 116, 144,';

      function resize() {
        W = canvas.width = canvas.offsetWidth;
        H = canvas.height = canvas.offsetHeight;
        initGraph();
      }

      function initGraph() {
        nodes = [];
        edges = [];

        const layers = [
          { x: 0.10, color: TEAL, count: 6 },
          { x: 0.32, color: GOLD, count: 7 },
          { x: 0.55, color: TEAL, count: 6 },
          { x: 0.78, color: GOLD, count: 7 },
          { x: 0.95, color: TEAL, count: 5 },
        ];
        layerXs = layers.map(l => l.x);

        layers.forEach((layer, li) => {
          for (let i = 0; i < layer.count; i++) {
            const yFrac = 0.08 + (i / (layer.count - 1)) * 0.84;
            nodes.push({
              x: layer.x * W + (Math.random() - 0.5) * W * 0.06,
              y: yFrac * H + (Math.random() - 0.5) * H * 0.04,
              vx: (Math.random() - 0.5) * 0.18,
              vy: (Math.random() - 0.5) * 0.18,
              r: 3 + Math.random() * 2.5,
              color: layer.color,
              layer: li,
              phase: Math.random() * Math.PI * 2,
            });
          }
        });

        const byLayer = layers.map((_, li) => nodes.filter(n => n.layer === li));

        for (let li = 0; li < byLayer.length - 1; li++) {
          byLayer[li].forEach(a => {
            const targets = byLayer[li + 1].slice().sort(() => Math.random() - 0.5).slice(0, 2);
            targets.forEach(b => edges.push({ a, b, phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() * 0.6 }));
          });
        }
        byLayer.forEach(layer => {
          for (let i = 0; i < layer.length - 1; i++) {
            if (Math.random() > 0.4) {
              edges.push({ a: layer[i], b: layer[i + 1], phase: Math.random() * Math.PI * 2, speed: 0.3, intra: true });
            }
          }
        });
      }

      let t = 0;
      function draw() {
        ctx.clearRect(0, 0, W, H);
        t += 0.005;

        ctx.strokeStyle = 'rgba(43, 125, 212, 0.1)';
        ctx.lineWidth = 1;
        const gs = 60;
        for (let x = 0; x < W; x += gs) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += gs) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        edges.forEach(e => {
          const progress = ((t * e.speed + e.phase) % (Math.PI * 2)) / (Math.PI * 2);
          const alpha = e.intra ? 0.08 : 0.12;
          ctx.strokeStyle = e.intra ? `${TEAL}${alpha})` : `${GOLD}${alpha})`;
          ctx.lineWidth = e.intra ? 0.5 : 0.8;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(e.a.x, e.a.y);
          ctx.lineTo(e.b.x, e.b.y);
          ctx.stroke();

          if (!e.intra) {
            const px = e.a.x + (e.b.x - e.a.x) * progress;
            const py = e.a.y + (e.b.y - e.a.y) * progress;
            const grad = ctx.createRadialGradient(px, py, 0, px, py, 6);
            grad.addColorStop(0, `${GOLD}0.8)`);
            grad.addColorStop(1, `${GOLD}0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        nodes.forEach(n => {
          const pulse = Math.sin(t * 1.2 + n.phase) * 0.4 + 0.6;
          const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 4);
          glow.addColorStop(0, `${n.color}${0.25 * pulse})`);
          glow.addColorStop(1, `${n.color}0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r * 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `${n.color}${0.7 + 0.3 * pulse})`;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fill();

          n.x += n.vx; n.y += n.vy;
          const cx = layerXs[n.layer];
          if (Math.abs(n.x - cx * W) > W * 0.06) n.vx *= -1;
          if (n.y < H * 0.05 || n.y > H * 0.95) n.vy *= -1;
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();
  </script>
